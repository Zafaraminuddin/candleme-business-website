<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Responsive layout review</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#222;color:#fff;font:16px/1.5 system-ui,sans-serif}
    header{display:flex;flex-wrap:wrap;align-items:center;gap:18px;padding:12px 20px;background:#111}
    label{display:flex;align-items:center;gap:8px}select{min-height:40px;font:inherit;padding:6px}
    main{padding:16px;overflow:auto}iframe{display:block;width:390px;height:844px;margin:0 auto;border:0;background:#080808}
  </style>
</head>
<body>
  <header>
    <label>Page <select id="page"><option value="sample-recovery.html">Recovery</option><option value="index.html">Home</option><option value="professional.html">Professional</option><option value="why-candleme.html">Why CandleMe</option><option value="dashboard.html">Dashboard</option><option value="start-a-pilot.html">Pilot</option></select></label>
    <label>Width <select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1363</option></select></label>
  </header>
  <main><iframe id="preview" title="Site at selected viewport width" src="sample-recovery.html?mobile-review=29"></iframe></main>
  <script>
    const preview=document.getElementById('preview');
    document.getElementById('width').addEventListener('change',event=>{preview.style.width=event.target.value+'px'});
    document.getElementById('page').addEventListener('change',event=>{preview.src=event.target.value+'?mobile-review=29'});
  </script>
</body>
</html>
